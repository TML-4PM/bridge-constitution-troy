version: 2
status: canonical-design
purpose: >-
  Govern the T4H MCP and Super-Agent estates as two independent authority domains.
  Public endpoint count is intentionally small; internal providers, workers,
  runners, model adapters and services are capability implementations, not
  additional public control planes.

systems:
  mcp:
    authority_domain: independent
    purpose: governed capability and tool access
    paths:
      low:
        risk: low
        persistence: [one_shot, session, permanent]
        default_authority: read
      bau:
        risk: bau
        persistence: [one_shot, session, permanent]
        description: high-value frequent-use approved capability sets
      high:
        risk: high
        persistence: [one_shot, session, permanent]
        description: specialist, consequential, privileged or sensitive access
    attributes:
      - capability
      - risk
      - persistence
      - boundary
      - authority
      - version
      - principal
      - scope
      - permission

  super_agent:
    authority_domain: independent
    purpose: autonomous problem solving, repair, execution and verification
    note: >-
      Super-Agent scopes, permissions, capabilities and tools are independent
      from MCP. Super-Agent is not an MCP permission gate and does not sit in
      the MCP routing path.

public:
  protocol:
    role: protocol ingress
    path: /mcp
    note: >-
      Canonical MCP protocol surface where deployed. It presents governed MCP
      capabilities; providers/adapters remain implementation details.
  health:
    role: liveness
    path: /healthz
    methods: [GET]
  readiness:
    role: readiness
    path: /readyz
    methods: [GET]

internal:
  capability_providers: bridge-only-or-private
  workers: private
  runners: private
  llm_adapters: private
  credential_services: private

routing_rules:
  - system: mcp
    route_by: [risk, persistence, boundary, capability, authority]
  - system: super_agent
    route_by: [scope, permission, capability, boundary]
  - cross_system:
    rule: explicit_integration_contract_only

forbidden:
  - implicit MCP permission inheritance by Super-Agent
  - Super-Agent acting as MCP permission gate
  - duplicate public MCP gateways for the same capability
  - public worker/runner/model endpoints without explicit architecture approval
  - credentials in source, logs, prompts, tool descriptions or evidence payloads
  - endpoint proliferation used as a substitute for capability routing
